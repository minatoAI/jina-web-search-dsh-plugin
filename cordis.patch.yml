# dsh-jina bundle layer — applied on top of a dsh profile's composition.
#
# One dual-face row (`dsh-jina`), the shape dsh uses for every browser-half
# package: the host half registers the twelve jina_* model tools and the
# network transport; the browser half is declared by the ROOT manifest's
# `dsh.client` + `exports["./client"]` and registers the "Jina Tools" card in
# the web settings panel. The client-modules scan only accepts rows whose
# `name` is an exact package name — subpath rows like `dsh-jina/ui` are never
# scanned into the Web boot graph, so the whole browser half must ride this
# one row.
#
# The API key pool lives in the host credential seam: one key per reference
# (`JINA_API_KEY` plus the free slots `JINA_API_KEY_2` … `JINA_API_KEY_10`,
# written by the web settings page via credentials.set — the card has one input
# and fills the first free slot) — the seam stores one value per reference and
# never reads one back, so several keys means several references, and any POSIX
# identifier is a legal reference name. The host rotates through them when a key
# is exhausted/rate-limited/revoked and *deletes* a key that is definitively
# unusable (401/402, or a balance of zero), so the card never has to show or
# manage a single key. The `jina-tools` settings namespace this row serves
# carries the local proxy address (`proxyUrl`) and the reader policy (`useOcr`,
# `imagePolicy`, `autoAltText`, `useSelectors` and the three selector
# overrides); this patch itself defines no settings.
- insert:
    - id: jina-tools
      name: dsh-jina
